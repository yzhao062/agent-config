interface:
  display_name: "Prun"
  short_description: "Fan a task out to parallel Agy workers while the coordinator only integrates"
  default_prompt: "Use $prun to fan a task into independent units that run in parallel on Agy (Gemini through the Antigravity CLI) while the coordinating session only decomposes, gathers each result, reviews each diff, and integrates. Neither Claude subagents nor Codex are prun executors: Claude workers bill the coordinator's own account, and Codex quota is reserved for the /vet reviewer role. Workers never commit or push: code-writing units run in a throwaway local clone with its remote removed. Look for the skill at skills/prun/SKILL.md first, then .claude/skills/prun/SKILL.md, then .agent-config/repo/skills/prun/SKILL.md. Read the dispatch-task-agy and gather scripts under scripts/ at the same path."
