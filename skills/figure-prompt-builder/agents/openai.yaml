interface:
  display_name: "Figure Prompt Builder"
  short_description: "Turn explanatory figure ideas into copy-ready downstream image-model prompts"
  default_prompt: "Use $figure-prompt-builder to decide what explanatory figure this section needs. For Yue Zhao's paper or proposal figures, first follow the editable-figure gallery's required preference-first protocol and carry its reference-to-design mapping into the brief and every prompt; otherwise pick a small number of structural or style donors when helpful. Then distill the core message into a concise figure brief and write a prompt pack I can paste into a downstream image model."
